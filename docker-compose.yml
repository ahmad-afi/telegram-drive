services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      TG_APP_ID: ${TG_APP_ID}
      TG_APP_HASH: ${TG_APP_HASH}
      PORT: 8080
      CORS_ORIGIN: "*"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
